reservation.insert=INSERT INTO reservations (reservation_code, payment_code, customer_id, trip_id, seat_id, status, created_at, expires_at) VALUES (?, ?, ?, ?, ?, ?, ?, ?) RETURNING id

reservation.find-by-id=SELECT id, reservation_code, payment_code, customer_id, trip_id, seat_id, status, created_at, expires_at FROM reservations WHERE id = ?

reservation.find-by-code=SELECT id, reservation_code, payment_code, customer_id, trip_id, seat_id, status, created_at, expires_at FROM reservations WHERE reservation_code = ?

reservation.find-by-payment-code=SELECT id, reservation_code, payment_code, customer_id, trip_id, seat_id, status, created_at, expires_at FROM reservations WHERE payment_code = ?

reservation.find-by-status=SELECT id, reservation_code, payment_code, customer_id, trip_id, seat_id, status, created_at, expires_at FROM reservations WHERE status = ? ORDER BY created_at DESC

reservation.find-expired=SELECT id, reservation_code, payment_code, customer_id, trip_id, seat_id, status, created_at, expires_at FROM reservations WHERE status = ? AND expires_at < ? ORDER BY expires_at

reservation.update-status=UPDATE reservations SET status = ? WHERE id = ?