seat.find-by-trip-id=SELECT id, trip_id, seat_number, status FROM seats WHERE trip_id = ? ORDER BY seat_number

seat.find-by-id=SELECT id, trip_id, seat_number, status FROM seats WHERE id = ?

seat.reserve-if-available=UPDATE seats SET status = 'RESERVED' WHERE id = ? AND status = 'AVAILABLE'

seat.release=UPDATE seats SET status = 'AVAILABLE' WHERE id = ? AND status = 'RESERVED'

seat.mark-as-sold=UPDATE seats SET status = 'SOLD' WHERE id = ? AND status = 'RESERVED'