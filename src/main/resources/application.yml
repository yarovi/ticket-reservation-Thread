spring:
  application:
    name: ticket-reservation

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticket_reservation}
    username: ${DB_USERNAME:ticket_user}
    password: ${DB_PASSWORD:ticket_password}
    driver-class-name: org.postgresql.Driver

    sql:
      init:
        mode: always
        schema-locations: classpath:db/schema.sql

    threads:
      virtual:
        enabled: true

  data:
    mongodb:
      uri: ${MONGODB_URI}/ticket_reservation
  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID:ticket-reservation-local}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: always

reservation:
  expiration: ${RESERVATION_EXPIRATION:PT30M}

server:
  port: ${SERVER_PORT:8080}

pubsub:
  topic: ${PUBSUB_TOPIC_ID:passenger-checked-in}
  subscription: ${PUBSUB_SUBSCRIPTION_ID:passenger-checked-in-subscription}
